name: Token-Aware Multi-Agent CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"
        
    - name: Install dependencies globally
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-cov torch transformers numpy
        # Recursively find and install ALL requirements.txt files across the entire repo
        find . -name "requirements.txt" -exec pip install -r {} \;
        
    - name: Run PyTest across entire repository
      env:
        # Include both the root and the backend folder in the python path to prevent import errors
        PYTHONPATH: ./:./token-aware-sre
      run: |
        # Pytest will recursively discover every test file across the entire repository
        pytest . -v --cov=. --cov-report=term-missing
