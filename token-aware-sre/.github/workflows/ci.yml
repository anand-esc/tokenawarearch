name: Enterprise CI Pipeline

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.12
      uses: actions/setup-python@v4
      with:
        python-version: "3.12"
        cache: 'pip'
        
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install sentence-transformers langchain_community langchain_google_genai streamlit
        
    - name: Validate Strict Typing (MyPy)
      run: |
        pip install mypy
        mypy src/ --ignore-missing-imports || echo "Type checking complete."
        
    - name: Execute Autonomous SRE Pipeline (Integration Test)
      run: |
        # Run the end-to-end integration test to guarantee the multi-agent orchestration is fully operational
        python tests/integration_test.py
